<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Қуръони Карим</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Scheherazade+New:wght@400;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--card:#1c2421;--bd:#2a3833;--mut:#9ca3af}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#121816;color:#f3f4f6;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
.font-quran{font-family:'Scheherazade New','Amiri',serif}
header{background:linear-gradient(135deg,#064e3b,#022c22);padding:16px;border-bottom:1px solid rgba(217,119,6,.2);position:sticky;top:0;z-index:40;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.ht{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.lc{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#059669,#047857);border:1px solid #34d399;display:flex;align-items:center;justify-content:center;color:#fde68a;font-size:20px}
.lc h1{font-size:17px;font-weight:700;color:#fff;line-height:1.2}
.lc p{font-size:11px;color:#a7f3d0}
.rb{font-size:10px;background:rgba(217,119,6,.25);border:1px solid #d97706;color:#fef3c7;padding:4px 8px;border-radius:20px;cursor:pointer}
.sb{position:relative}
.sb input{width:100%;background:rgba(0,0,0,.3);border:1px solid #065f46;border-radius:12px;padding:10px 14px 10px 38px;color:#fff;font-size:13px;outline:none;user-select:text}
.sb input:focus{border-color:#10b981}
.si{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px}
.cb{display:flex;gap:8px;padding:10px 16px;background:#161e1b;border-bottom:1px solid #23312b;overflow-x:auto;scrollbar-width:none}
.cb::-webkit-scrollbar{display:none}
.chip{background:#202b27;border:1px solid #2f3e38;color:#d1d5db;padding:6px 12px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;cursor:pointer;display:flex;align-items:center;gap:5px}
.chip.active{background:#047857;border-color:#10b981;color:#fff}
.list{flex:1;padding:12px 16px 170px;display:flex;flex-direction:column;gap:10px;max-width:600px;width:100%;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.card:active{transform:scale(.98);border-color:#10b981}
.card.on{border-color:#10b981;background:#142e24}
.sl,.sr{display:flex;align-items:center;gap:10px}
.num{width:36px;height:36px;border-radius:10px;background:#23312b;border:1px solid #33463e;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#34d399;flex-shrink:0}
.card h3{font-size:14px;font-weight:700;color:#fff;margin-bottom:2px}
.card p{font-size:11px;color:var(--mut)}
.ar{font-size:22px;font-weight:bold;color:#fde68a}
.play{width:38px;height:38px;border-radius:50%;background:#047857;border:none;color:#fff;cursor:pointer;font-size:14px;flex-shrink:0}
.dl{min-width:38px;height:38px;border-radius:50%;background:#23312b;border:1px solid #33463e;color:#fff;font-size:12px;cursor:pointer;padding:0 6px;flex-shrink:0}
.dock{position:fixed;bottom:0;left:0;right:0;background:rgba(18,24,22,.96);backdrop-filter:blur(10px);border-top:1px solid #23312b;padding:12px 16px 16px;z-index:50;box-shadow:0 -10px 25px rgba(0,0,0,.6)}
.di{max-width:600px;margin:0 auto}
.pc{width:100%;height:6px;background:#23312b;border-radius:3px;margin-bottom:10px;cursor:pointer}
.pb{height:100%;background:linear-gradient(90deg,#10b981,#f59e0b);border-radius:3px;width:0}
.pr{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.pt{font-size:13px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.prc{font-size:11px;color:#34d399}
.ptm{font-size:11px;color:var(--mut)}
.pcs{display:flex;align-items:center;justify-content:center;gap:20px}
.db{background:none;border:none;color:#d1d5db;font-size:18px;cursor:pointer;padding:6px}
.dp{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#10b981,#047857);border:none;color:#fff;font-size:20px;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:60;display:none;flex-direction:column}
.modal.open{display:flex}
.mh{background:#161e1b;padding:14px 16px;border-bottom:1px solid #23312b;display:flex;align-items:center;justify-content:space-between;gap:8px}
.mb{flex:1;overflow-y:auto;padding:20px 16px 60px;max-width:600px;margin:0 auto;width:100%}
.bis{text-align:center;font-size:26px;color:#fde68a;margin:10px 0 24px}
.ay{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
.aa{font-size:24px;line-height:2.2;text-align:right;color:#fff;margin-bottom:12px;direction:rtl}
.at{font-size:14px;line-height:1.6;color:#cbd5e1;padding-top:10px;border-top:1px solid var(--bd)}
.an{display:inline-block;width:26px;height:26px;line-height:26px;text-align:center;border-radius:50%;background:#047857;color:#fef08a;font-size:12px;font-weight:bold}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#065f46;color:#fff;padding:10px 18px;border-radius:24px;font-size:12px;z-index:100;display:none}
</style>
</head>
<body>
<div id="toast" class="toast"></div>
<header>
<div class="ht">
<div class="lc"><div class="logo font-quran">قرآن</div><div><h1>Қуръони Карим</h1><p>Бо забони тоҷикӣ ва русӣ</p></div></div>
<button class="rb" onclick="toggleReciter()">🎙️ <span id="rn">Ал-Луҳайдон</span></button>
</div>
<div class="sb"><span class="si">🔍</span><input type="text" id="q" placeholder="Ҷустуҷӯ: рақам (1-114) ё номи сура..." oninput="renderSurahs()"></div>
</header>
<div class="cb">
<button class="chip active" id="cAll" onclick="filterSurahs('all')">Ҳама (114)</button>
<button class="chip active" id="cL" onclick="setReciter('luhaidan')">🎙️ ал-Луҳайдон</button>
<button class="chip" id="cD" onclick="setReciter('dossari')">🎙️ ад-Дусарӣ</button>
<button class="chip" id="cJ" onclick="filterSurahs('juz30')">📖 Ҷузъи 30</button>
<button class="chip" onclick="toggleLang()">🌐 <span id="lang">Тоҷикӣ</span></button>
</div>
<main class="list" id="list"></main>
<div class="dock"><div class="di">
<div class="pc" id="pc" onclick="seekAudio(event)"><div class="pb" id="pb"></div></div>
<div class="pr"><div><div class="pt" id="pt">Сура интихоб нашудааст</div><div class="prc" id="prc">Муҳаммад ал-Луҳайдон</div></div><div class="ptm" id="ptm">0:00 / 0:00</div></div>
<div class="pcs">
<button class="db" onclick="prevSurah()">⏮️</button>
<button class="dp" id="dp" onclick="togglePlayAudio()">▶</button>
<button class="db" onclick="nextSurah()">⏭️</button>
<button class="db" onclick="openReaderModal(cur)">📖</button>
</div></div></div>
<audio id="audio" preload="auto"></audio>
<div class="modal" id="modal">
<div class="mh">
<div><h2 id="mt" style="font-size:15px;color:#fff">Сура</h2><p id="ms" style="font-size:11px;color:#34d399"></p></div>
<div style="display:flex;gap:8px"><button class="chip" onclick="playSurah(modalSurah)">▶ Садо</button><button class="chip" onclick="closeReaderModal()">✕</button></div>
</div>
<div class="mb" id="mbody"><div class="bis font-quran" id="bis">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div><div id="ayahs"></div></div>
</div>

var SURAHS=D.map(function(d,i){return{num:i+1,name:d[0],ar:d[1],tg:d[2],ayahs:d[3],type:MED.indexOf(i+1)>-1?'Мадина':'Макка'}});

function $(id){return document.getElementById(id)}
function toast(m){var t=$('toast');t.textContent=m;t.style.display='block';setTimeout(function(){t.style.display='none'},2200)}
function fmt(s){if(!isFinite(s))return '0:00';return Math.floor(s/60)+':'+('0'+Math.floor(s%60)).slice(-2)}

/* ===== IndexedDB ===== */
function openDB(cb){
try{
var r=indexedDB.open('quranDB',1);
r.onupgradeneeded=function(e){var d=e.target.result;d.createObjectStore('audio');d.createObjectStore('text')};
r.onsuccess=function(e){db=e.target.result;cb()};
r.onerror=function(){cb()};
}catch(e){cb()}
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
}
function dbGet(s,k){return new Promise(function(res){if(!db)return res(null);try{var q=db.transaction(s).objectStore(s).get(k);q.onsuccess=function(){res(q.result||null)};q.onerror=function(){res(null)}}catch(e){res(null)}})}
function dbPut(s,k,v){return new Promise(function(res,rej){if(!db)return rej();try{var t=db.transaction(s,'readwrite');t.objectStore(s).put(v,k);t.oncomplete=res;t.onerror=rej}catch(e){rej()}})}
function dbDel(s,k){return new Promise(function(res){if(!db)return res();var t=db.transaction(s,'readwrite');t.objectStore(s).delete(k);t.oncomplete=res;t.onerror=res})}
function refreshDone(){
done={};
if(!db){renderSurahs();return}
var q=db.transaction('audio').objectStore('audio').getAllKeys();
q.onsuccess=function(){q.result.forEach(function(k){done[k]=true});renderSurahs()};
q.onerror=renderSurahs;
}

/* ===== Рӯйхат ===== */
function renderSurahs(){
var q=$('q').value.trim().toLowerCase();
var html='';
SURAHS.forEach(function(s){
if(filter==='juz30'&&s.num<78)return;
if(q&&!(String(s.num)===q||s.name.toLowerCase().indexOf(q)>-1||s.tg.toLowerCase().indexOf(q)>-1||s.ar.indexOf(q)>-1))return;
var on=s.num===cur&&isPlaying;
var key=rec+'_'+s.num;
var d=busy[s.num]!==undefined?busy[s.num]+'%':(done[key]?'✅':'⬇');
html+='<div class="card'+(on?' on':'')+'" onclick="openReaderModal('+s.num+')"><div class="sl"><div class="num">'+s.num+'</div><div><h3>'+s.name+'</h3><p>'+s.tg+' • '+s.ayahs+' оят • '+s.type+'</p></div></div><div class="sr"><span class="ar font-quran">'+s.ar+'</span><button class="dl" id="dl-'+s.num+'" onclick="event.stopPropagation();toggleDownload('+s.num+')">'+d+'</button><button class="play" onclick="event.stopPropagation();playSurah('+s.num+')">'+(on?'⏸':'▶')+'</button></div></div>';
});
$('list').innerHTML=html||'<p style="text-align:center;color:#9ca3af;padding:30px">Ёфт нашуд</p>';
}
function filterSurahs(f){filter=f;$('cAll').classList.toggle('active',f==='all');$('cJ').classList.toggle('active',f==='juz30');renderSurahs()}
function setReciter(id){
rec=id;
$('rn').textContent=RECITERS[id].short;
$('prc').textContent=RECITERS[id].name;
$('cL').classList.toggle('active',id==='luhaidan');
$('cD').classList.toggle('active',id==='dossari');
if(audio.getAttribute('src'))loadAudio(cur,isPlaying);
renderSurahs();toast(RECITERS[id].name);
}
function toggleReciter(){setReciter(rec==='luhaidan'?'dossari':'luhaidan')}
function toggleLang(){
lang=lang==='tg'?'ru':'tg';
$('lang').textContent=lang==='tg'?'Тоҷикӣ':'Русӣ';
if($('modal').classList.contains('open'))openReaderModal(modalSurah);
}

/* ===== Садо ===== */
function loadAudio(n,play){
return dbGet('audio',rec+'_'+n).then(function(b){
if(blobUrl){URL.revokeObjectURL(blobUrl);blobUrl=null}
if(b){blobUrl=URL.createObjectURL(b);audio.src=blobUrl}else audio.src=RECITERS[rec].url(n);
if(play)audio.play().catch(function(){toast('Садо бор нашуд. Интернетро санҷед.')});
});
}
function playSurah(n){
if(n===cur&&audio.getAttribute('src')){togglePlayAudio();return}
cur=n;
var s=SURAHS[n-1];
$('pt').textContent=n+'. '+s.name+' — '+s.tg;
$('prc').textContent=RECITERS[rec].name;
loadAudio(n,true).then(renderSurahs);
}
function togglePlayAudio(){
if(!audio.getAttribute('src')){playSurah(cur);return}
if(audio.paused)audio.play().catch(function(){});else audio.pause();
}
function prevSurah(){cur=cur>1?cur-1:114;audio.removeAttribute('src');playSurah(cur)}
function nextSurah(){cur=cur<114?cur+1:1;audio.removeAttribute('src');playSurah(cur)}
function seekAudio(e){var r=$('pc').getBoundingClientRect();if(audio.duration)audio.currentTime=((e.clientX-r.left)/r.width)*audio.duration}
audio.addEventListener('timeupdate',function(){
$('pb').style.width=(audio.duration?audio.currentTime/audio.duration*100:0)+'%';
$('ptm').textContent=fmt(audio.currentTime)+' / '+fmt(audio.duration);
});
audio.addEventListener('play',function(){isPlaying=true;$('dp').textContent='⏸';renderSurahs()});
audio.addEventListener('pause',function(){isPlaying=false;$('dp').textContent='▶';renderSurahs()});
audio.addEventListener('ended',nextSurah);
audio.addEventListener('error',function(){if(audio.getAttribute('src'))toast('Хатогии садо')});

/* ===== Боргирӣ ===== */
function toggleDownload(n){
var key=rec+'_'+n;
if(busy[n]!==undefined)return;
if(done[key]){
if(confirm('Ин сураро аз хотира нест кунем?'))dbDel('audio',key).then(function(){delete done[key];renderSurahs()});
return;
}
busy[n]=0;renderSurahs();
fetch(RECITERS[rec].url(n)).then(function(resp){
if(!resp.ok)throw 0;
var total=+resp.headers.get('content-length')||0;
if(!resp.body||!resp.body.getReader)return resp.blob();
var rd=resp.body.getReader(),ch=[],got=0;
function pump(){return rd.read().then(function(r){
if(r.done)return new Blob(ch,{type:'audio/mpeg'});
ch.push(r.value);got+=r.value.length;
if(total){busy[n]=Math.floor(got/total*100);var b=$('dl-'+n);if(b)b.textContent=busy[n]+'%'}
return pump();
})}
return pump();
}).then(function(b){return dbPut('audio',key,b)})
.then(function(){return fetchText(n).catch(function(){})})
.then(function(){delete busy[n];done[key]=true;renderSurahs();toast('Захира шуд ✅')})
.catch(function(){delete busy[n];renderSurahs();toast('Боргирӣ нашуд (интернет ё сервер)')});
}

/* ===== Матн ===== */
function fetchText(n){
return dbGet('text',n).then(function(c){
if(c)return c;
return fetch('https://api.alquran.cloud/v1/surah/'+n+'/editions/quran-uthmani,tg.ayati,ru.kuliev')
.then(function(r){return r.json()})
.then(function(d){
var arr=d.data.map(function(e){return e.ayahs.map(function(a){return{n:a.numberInSurah,t:a.text}})});
dbPut('text',n,arr).catch(function(){});
return arr;
});
});
}
function openReaderModal(n){
modalSurah=n;
var s=SURAHS[n-1];
$('mt').textContent=n+'. '+s.name+' ('+s.ar+')';
$('ms').textContent=s.tg+' • '+s.ayahs+' оят';
$('bis').style.display=(n===1||n===9)?'none':'block';
var box=$('ayahs');
box.innerHTML='<p style="text-align:center;color:#9ca3af">Бор мешавад...</p>';
$('modal').classList.add('open');
$('mbody').scrollTop=0;
var idx=lang==='tg'?1:2;
fetchText(n).then(function(data){
var ar=data[0],t=data[idx],h='';
for(var i=0;i<ar.length;i++){
var txt=ar[i].t;
if(i===0&&n!==1&&n!==9)txt=txt.split(' ').slice(4).join(' ');
h+='<div class="ay"><div class="aa font-quran">'+txt+' <span class="an">'+ar[i].n+'</span></div><div class="at">'+(t[i]?t[i].t:'')+'</div></div>';
}
box.innerHTML=h;
}).catch(function(){
box.innerHTML='<p style="text-align:center;color:#f87171">Хатогӣ. Интернетро санҷед ё аввал сураро боргирӣ кунед (⬇).</p>';
});
}
function closeReaderModal(){$('modal').classList.remove('open')}

openDB(refreshDone);
</script>
